name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # Check name "CI / api": keep stable, it is a required status check.
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore SaasDemo.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build SaasDemo.sln -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test SaasDemo.sln -c Release --no-build
          --logger trx
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

      - name: Write test summary
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          rows, failed_tests = [], []
          for path in sorted(glob.glob("TestResults/**/*.trx", recursive=True)):
              root = ET.parse(path).getroot()
              c = root.find("t:ResultSummary/t:Counters", ns).attrib
              name = os.path.basename(path)
              for r in root.findall("t:Results/t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      failed_tests.append(r.get("testName"))
              rows.append(f"| {name} | {c['total']} | {c['passed']} | {c['failed']} | {int(c['total']) - int(c['executed'])} |")
          lines = ["## API tests", "", "| Run | Total | Passed | Failed | Skipped |", "|---|---|---|---|---|", *rows]
          if not rows:
              lines.append("| (no TRX files found) | | | | |")
          if failed_tests:
              lines += ["", "### Failed", *[f"- `{t}`" for t in failed_tests]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")

  web:
    # Check name "CI / web": keep stable, it is a required status check.
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (single run)
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build -- --configuration production
