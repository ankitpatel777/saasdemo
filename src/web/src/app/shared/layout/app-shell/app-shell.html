<ng-template #content><ng-content /></ng-template>

@if (session.me(); as me) {
  <mat-toolbar class="toolbar" role="banner">
    @if (navItems().length && isHandset()) {
      <button mat-icon-button type="button" aria-label="Open navigation" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <span class="tenant" data-testid="tenant-name">{{ me.tenant.name }}</span>
    <span class="spacer"></span>
    <span class="user">
      <span class="name" data-testid="display-name">{{ me.displayName }}</span>
      <span class="role" data-testid="role-badge">{{ me.role }}</span>
    </span>
    <button mat-button type="button" (click)="session.logout()">
      <mat-icon>logout</mat-icon>
      Sign out
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="container">
    <mat-sidenav
      #drawer
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="navItems().length > 0 && !isHandset()"
      [disableClose]="!isHandset()"
      class="sidenav"
    >
      <nav aria-label="Main">
        <ul class="nav">
          @for (item of navItems(); track item.link) {
            <li>
              <a
                class="nav-link"
                [routerLink]="item.link"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                (click)="onNavigate()"
              >
                <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="content" id="main">
        <ng-container [ngTemplateOutlet]="content" />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <main class="content plain">
    <ng-container [ngTemplateOutlet]="content" />
  </main>
}
